name: Render Backend Keep-Alive

on:
  schedule:
    # Trigger every 14 minutes (Render free tier spins down after 15 minutes of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    name: Keep Render Backend Awake
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          BACKEND_URL="${{ secrets.BACKEND_HEALTH_URL || 'https://chefbot-backend.onrender.com/health' }}"
          echo "Pinging $BACKEND_URL to prevent Render sleep..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL")
          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Backend is warm and active!"
          else
            echo "⚠️ Unexpected status: $HTTP_STATUS"
          fi
