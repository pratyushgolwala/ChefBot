version: '3.8'

services:
  backend:
    build:
      context: ./chefbot/backend
      dockerfile: Dockerfile
    container_name: chefbot-backend
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
    volumes:
      - ./chefbot/backend:/app
    restart: unless-stopped
    networks:
      - chefbot-network

  frontend:
    build:
      context: ./chefbot/frontend
      dockerfile: Dockerfile
    container_name: chefbot-frontend
    ports:
      - "5174:5174"
    environment:
      - VITE_BACKEND_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - chefbot-network

networks:
  chefbot-network:
    driver: bridge
