services:
  - type: web
    name: chefbot-backend
    env: python
    region: us-east-1
    plan: free
    
    # Build configuration
    buildCommand: cd chefbot/backend && pip install -r ../../requirements.txt
    
    # Start configuration
    startCommand: cd chefbot/backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    
    # Environment variables
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
    
    # Health check
    healthCheckPath: /health
    
    # Limits
    numInstances: 1
    instanceType: starter
    
    # Auto-scaling (optional, requires paid plan)
    # autoDeploy: true
